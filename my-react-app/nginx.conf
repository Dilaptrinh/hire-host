server {
    listen 80 default_server;
    server_name bootnode.cloud;
    client_max_body_size 50m;

    location /oauth2/authorization/ {
        proxy_pass http://backend:8081/oauth2/authorization/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8081/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Domain cũ *.duycode.id.vn -> thông báo đã đổi domain ---
server {
    listen 80;
    server_name *.duycode.id.vn;

    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Domain chính thức đã đổi</title></head><body style="text-align:center;font-family:Arial,sans-serif;padding:60px 20px;background:#f5f7fa;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="background:#fff;padding:48px 32px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);max-width:520px;width:100%;"><h1 style="margin:0 0 12px;color:#1a1a2e;">Domain chính thức đã đổi</h1><p style="font-size:17px;color:#6b7280;line-height:1.6;">Trang web chính thức của chúng tôi hiện tại là <strong style="color:#1677ff;">bootnode.cloud</strong>. Vui lòng bấm nút bên dưới để chuyển sang trang mới.</p><a href="https://bootnode.cloud" style="display:inline-block;padding:14px 36px;background:#1677ff;color:#fff;border-radius:10px;text-decoration:none;font-size:18px;font-weight:600;margin-top:20px;">Chuyển đến bootnode.cloud</a></div></body></html>';
    }
}

# --- Static hosting wildcard ---
server {
    listen 80;
    server_name "~^(?<site>[a-z0-9-]+)\.bootnode\.cloud$";

    location / {
        root /srv/hosted-sites/$site;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Chống thực thi file nguy hiểm
    location ~ \.(php|phtml|php5|pl|py|cgi|sh)$ { return 403; }
    location ~ /\.ht { deny all; }
    # Chống liệt kê thư mục
    autoindex off;
}
