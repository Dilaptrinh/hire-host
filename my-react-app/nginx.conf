server {
    listen 80 default_server;
    server_name hosting.duycode.id.vn;

    location /oauth2/authorization/ {
        proxy_pass http://backend:8081/oauth2/authorization/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8081/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Static hosting wildcard ---
server {
    listen 80;
    server_name ~^(?<site>[a-z0-9]{6})\.hosting\.duycode\.id\.vn$;

    root /srv/hosted-sites/$site;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chống thực thi file nguy hiểm
    location ~ \.(php|phtml|php5|pl|py|cgi|sh)$ { return 403; }
    location ~ /\.ht { deny all; }
    # Chống liệt kê thư mục
    autoindex off;
}
